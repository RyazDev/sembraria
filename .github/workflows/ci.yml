name: CI - SembrarIA Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.0"

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sembraria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install system deps (GDAL for rasterio)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          # Pin GDAL para que rasterio compile contra la version del sistema
          pip install GDAL==$(gdal-config --version)
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Generate synthetic rasters (needed for tests)
        run: |
          mkdir -p data/inputs
          python scripts/data/generate_synthetic_rasters.py

      - name: Create test .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=development
          APP_NAME=SembrarIA
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/sembraria_test
          JWT_SECRET=ci-test-secret-do-not-use-in-production-2026
          JWT_ALGORITHM=HS256
          JWT_EXPIRE_HOURS=24
          JWT_KEY_ID=v1
          PREVIOUS_JWT_SECRET=
          PREVIOUS_JWT_KEY_ID=
          JWT_ROTATED_AT=
          JWT_GRACE_SECONDS=86400
          LOGIN_RATE_LIMIT_PER_MINUTE=100
          RASTER_INPUTS_DIR=./data/inputs
          RASTER_OUTPUTS_DIR=./data/outputs
          API_PORT=8000
          CORS_ORIGINS=http://localhost:5173
          EOF

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sembraria_test
        run: |
          python -c "
          import os
          from sembraria.init_db import init_db
          init_db()
          print('migrations OK')
          "

      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/sembraria_test
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/api/test-results.xml
