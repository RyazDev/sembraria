# ====================================================================
# SEMBRARIA — Geofence de Caquetá
# ====================================================================
caqueta:
  # CRS para display en frontend (lat/lon)
  display_crs: EPSG:4326

  # CRS para calculos de area en metros (Magna-Sirgas / Colombia Bogota)
  area_crs: EPSG:3116

  # Bounding box aproximado del departamento
  bbox: [-76.3, -0.7, -73.6, 2.3]

  # Tabla PostGIS con el poligono exacto del departamento
  boundary_table: caqueta_boundary

  # Limites de ha para fincas validas
  min_farm_ha: 0.1
  max_farm_ha: 1000

  # Municipios principales
  municipios:
    - id: florencia
      name: "Florencia"
      lat: 1.6144
      lng: -75.6063
    - id: belen_de_los_andaquies
      name: "Belén de los Andaquíes"
      lat: 1.4167
      lng: -75.8722
    - id: el_doncello
      name: "El Doncello"
      lat: 1.6800
      lng: -75.2850
    - id: san_vicente_del_caguan
      name: "San Vicente del Caguán"
      lat: 2.1167
      lng: -74.7667
    - id: cartagena_del_chaira
      name: "Cartagena del Chairá"
      lat: 1.3500
      lng: -74.8500
    - id: albania
      name: "Albania"
      lat: 1.3286
      lng: -75.8786
    - id: curillo
      name: "Curillo"
      lat: 1.0333
      lng: -75.9167
    - id: morelia
      name: "Morelia"
      lat: 1.4872
      lng: -75.7222
    - id: valparaiso
      name: "Valparaíso"
      lat: 1.1950
      lng: -75.7080
    - id: solita
      name: "Solita"
      lat: 0.9000
      lng: -75.6167
    - id: milan
      name: "Milán"
      lat: 1.2889
      lng: -75.5089
    - id: puerto_rico
      name: "Puerto Rico"
      lat: 1.9083
      lng: -75.1500
