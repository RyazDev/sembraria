name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Corre todos los lunes a las 9:00 UTC
    - cron: "0 9 * * 1"

jobs:
  pip-audit:
    name: pip-audit (vulnerabilidades conocidas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r requirements.txt
      - name: Run pip-audit
        working-directory: apps/api
        run: pip-audit --strict --requirement requirements.txt
        continue-on-error: false

  bandit:
    name: Bandit (linter de seguridad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: |
          bandit -r apps/api/sembraria/ -ll --format json --output bandit-report.json
          bandit -r apps/api/sembraria/ -ll
        continue-on-error: true
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
