[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sembraria-api"
version = "1.0.0"
description = "SembrarIA backend - FastAPI + PostGIS + rasterio"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Universidad de la Amazonia" }]

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "geoalchemy2==0.16.0",
    "psycopg2-binary==2.9.10",
    "shapely==2.0.6",
    "pyyaml==6.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.17",
    "rasterio==1.4.3",
    "numpy==2.1.3",
    "matplotlib==3.10.0",
    "reportlab==4.2.5",
    "Pillow==11.0.0",
    "httpx==0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "black==24.10.0",
    "ruff==0.8.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sembraria*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
